<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedMAS — Chest X-ray Analysis</title>
  <style>
    :root {
      --bg: #f0f2f7;
      --sidebar-bg: #ffffff;
      --surface: #ffffff;
      --surface2: #f5f6fa;
      --border: #e0e3ee;
      --text: #1c1e2e;
      --text-dim: #8890aa;
      --accent: #5b6cf9;
      --accent-h: #4a5aee;
      --user-bg: #5b6cf9;
      --red: #e53e3e;
      --green: #2f9e6e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
      font-size: 15px;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 10px;
      gap: 10px;
      overflow: hidden;
    }

    #sidebar-logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      padding: 0 4px;
    }

    .sb-divider { height: 1px; background: var(--border); }

    #btn-new-case {
      width: 100%;
      padding: 8px 12px;
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      transition: background 0.15s;
    }
    #btn-new-case:hover { background: var(--accent-h); }

    /* Session list */
    #session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #session-list::-webkit-scrollbar { width: 3px; }
    #session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .session-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .session-item:hover { background: var(--surface2); }
    .session-item.active {
      background: #eef0ff;
      border-color: #c8ccff;
    }
    .session-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item.active .session-title { color: var(--accent); font-weight: 500; }

    /* ── Main ────────────────────────────────────────────────── */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    /* ── Messages ────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 10px; max-width: 80%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.65;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-radius: 14px 4px 14px 14px;
      color: #ffffff;
    }
    .msg.assistant .bubble {
      background: var(--surface);
      border-radius: 4px 14px 14px 14px;
      border: 1px solid var(--border);
    }

    /* Inline media in user bubble */
    .msg-img-preview {
      max-width: 260px;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .msg-pdf-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      font-size: 12px;
      color: #ffffff;
      margin-bottom: 8px;
      max-width: 220px;
      overflow: hidden;
    }
    .msg-pdf-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Inline elements */
    .bubble strong { font-weight: 600; color: #3347d4; }
    .bubble em { color: var(--text-dim); font-style: italic; }
    .msg.user .bubble strong { color: #dde4ff; }
    .bubble br { display: block; content: ""; margin: 3px 0; }

    .cursor { color: var(--accent); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Grad-CAM */
    .gradcam-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }
    .gradcam-row:empty { display: none; margin: 0; }
    .gradcam-wrap { flex: 0 0 auto; }
    .gradcam-wrap img {
      width: 220px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
    }
    .gradcam-caption { font-size: 11px; color: var(--text-dim); margin-top: 4px; text-align: center; }

    /* Input image preview */
    .input-img-preview {
      position: relative;
      display: inline-block;
      margin-bottom: 4px;
    }
    .input-img-preview img {
      width: 110px;
      height: 84px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
    }
    .input-img-remove {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 20px;
      height: 20px;
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }
    .input-img-remove:hover { opacity: 0.82; }

    /* Sources */
    .sources-btn {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
    }
    .sources-btn:hover { text-decoration: underline; }
    .sources-panel {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .sources-panel.open { display: block; }
    .src-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .src-item:last-child { border-bottom: none; padding-bottom: 0; }
    .src-item a { color: var(--accent); text-decoration: none; }
    .src-item a:hover { text-decoration: underline; }
    .src-excerpt { color: var(--text-dim); font-size: 11px; margin-top: 3px; line-height: 1.5; }

    /* Actions bar */
    .actions-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* PDF download */
    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-pdf:hover { background: var(--accent-h); }

    /* Typing dots */
    .typing { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-7px); }
    }

    /* ── Input bar ───────────────────────────────────────────── */
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--sidebar-bg);
      padding: 10px 14px 14px;
    }
    #chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; min-height: 0; }
    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px 3px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      max-width: 200px;
    }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-x { cursor: pointer; color: var(--text-dim); font-size: 16px; line-height: 1; flex-shrink: 0; }
    .chip-x:hover { color: var(--red); }

    #input-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 8px;
      transition: border-color 0.15s;
    }
    #input-row:focus-within { border-color: var(--accent); }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 5px;
      border-radius: 6px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: var(--accent); background: var(--surface2); }

    #text-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 24px;
      max-height: 130px;
      line-height: 1.5;
      padding: 2px 0;
    }
    #text-input::placeholder { color: var(--text-dim); }

    #send-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-h); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #file-attach { display: none; }

    /* ── Markdown inside bubble ─────────────────────────────── */
    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      font-weight: 700;
      margin: 12px 0 6px;
      color: var(--text);
      line-height: 1.3;
    }
    .bubble h1 { font-size: 1.2em; }
    .bubble h2 { font-size: 1.1em; }
    .bubble h3, .bubble h4 { font-size: 1em; }
    .bubble ul, .bubble ol {
      padding-left: 20px;
      margin: 4px 0 8px;
    }
    .bubble li { margin: 2px 0; }
    .bubble code {
      background: #f0f2f7;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.87em;
      font-family: 'Menlo', 'Consolas', monospace;
      color: #c0392b;
    }
    .bubble pre {
      background: #1e1e2e;
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
      color: #cdd6f4;
      font-size: 0.85em;
      line-height: 1.6;
    }
    .bubble blockquote {
      border-left: 3px solid var(--accent);
      margin: 8px 0;
      padding: 4px 12px;
      color: var(--text-dim);
      font-style: italic;
    }
    .bubble a:not(.btn-pdf) { color: var(--accent); text-decoration: underline; }
    .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.9em; }
    .bubble th, .bubble td {
      border: 1px solid var(--border);
      padding: 5px 10px;
      text-align: left;
    }
    .bubble th { background: var(--surface2); font-weight: 600; }
    .msg.user .bubble code { background: rgba(255,255,255,0.15); color: #dde4ff; border-color: rgba(255,255,255,0.2); }

    /* Error toast */
    #toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff1f1;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <div id="sidebar">
    <div id="sidebar-logo">🩻 MedMAS</div>
    <div class="sb-divider"></div>
    <button id="btn-new-case">+ Chat mới</button>
    <div class="sb-divider"></div>
    <div id="session-list"></div>
  </div>

  <div id="main">
    <div id="messages"></div>

    <div id="input-area">
      <div id="chips"></div>
      <div id="input-row">
        <button class="icon-btn" id="btn-attach" title="Đính kèm ảnh X-quang hoặc báo cáo PDF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.42 16.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea id="text-input" rows="1" placeholder="Nhập câu hỏi, hoặc để trống rồi nhấn gửi..."></textarea>
        <button id="send-btn" title="Gửi (Enter)">▶</button>
      </div>
      <input type="file" id="file-attach" accept="image/png,image/jpeg,image/jpg,application/pdf">
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    'use strict';

    // ── State ────────────────────────────────────────────────────────────────────
    let threadId = null;
    let pendingImg = null;
    let pendingPdf = null;
    let streaming = false;

    // Sessions list — newest first
    // { threadId, title, fragment: DocumentFragment | null }
    const sessions = [];

    // ── Init ─────────────────────────────────────────────────────────────────────
    (async () => { await startNewSession(); })();

    // ── Session management ────────────────────────────────────────────────────────
    function saveCurrentSession() {
      const sess = sessions.find(s => s.threadId === threadId);
      if (!sess) return;
      const msgs = document.getElementById('messages');
      if (msgs.children.length === 0) return;
      const frag = document.createDocumentFragment();
      while (msgs.firstChild) frag.appendChild(msgs.firstChild);
      sess.fragment = frag;
    }

    async function startNewSession() {
      if (streaming) return;

      // Archive current session
      saveCurrentSession();

      const res = await fetch('/api/new-session', { method: 'POST' });
      const { thread_id } = await res.json();
      threadId = thread_id;

      // Add new session entry at top
      sessions.unshift({ threadId, title: 'Chat mới', fragment: null });

      // Reset UI
      document.getElementById('messages').innerHTML = '';
      pendingImg = null;
      pendingPdf = null;
      renderChips();
      renderSessionList();
    }

    function switchToSession(tid) {
      if (tid === threadId || streaming) return;

      // Archive current
      saveCurrentSession();

      // Restore target
      const target = sessions.find(s => s.threadId === tid);
      if (!target) return;

      threadId = tid;
      const msgs = document.getElementById('messages');
      msgs.innerHTML = '';
      if (target.fragment) {
        msgs.appendChild(target.fragment);
        target.fragment = null; // nodes are now in DOM
      }
      scrollBottom();
      renderSessionList();
    }

    function renderSessionList() {
      const list = document.getElementById('session-list');
      list.innerHTML = '';
      for (const sess of sessions) {
        const item = document.createElement('div');
        item.className = 'session-item' + (sess.threadId === threadId ? ' active' : '');
        item.innerHTML = `<div class="session-title">${esc(sess.title)}</div>`;
        if (sess.threadId !== threadId) {
          item.addEventListener('click', () => switchToSession(sess.threadId));
        }
        list.appendChild(item);
      }
    }

    document.getElementById('btn-new-case').addEventListener('click', startNewSession);

    // ── File attach ───────────────────────────────────────────────────────────────
    document.getElementById('btn-attach').addEventListener('click', () => {
      document.getElementById('file-attach').click();
    });

    document.getElementById('file-attach').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';
      if (file.type === 'application/pdf') {
        pendingPdf = { file, name: file.name };
      } else {
        if (pendingImg?.url) URL.revokeObjectURL(pendingImg.url);
        pendingImg = { file, url: URL.createObjectURL(file), name: file.name };
      }
      renderChips();
    });

    function renderChips() {
      const chips = document.getElementById('chips');
      chips.innerHTML = '';
      if (pendingImg) {
        const wrap = document.createElement('div');
        wrap.className = 'input-img-preview';
        const img = document.createElement('img');
        img.src = pendingImg.url;
        img.alt = pendingImg.name;
        const rm = document.createElement('div');
        rm.className = 'input-img-remove';
        rm.textContent = '×';
        rm.addEventListener('click', () => {
          URL.revokeObjectURL(pendingImg.url);
          pendingImg = null;
          renderChips();
        });
        wrap.append(img, rm);
        chips.appendChild(wrap);
      }
      if (pendingPdf) chips.appendChild(makeChip('📄', pendingPdf.name, () => {
        pendingPdf = null; renderChips();
      }));
    }

    function makeChip(icon, name, onRemove) {
      const c = document.createElement('div');
      c.className = 'chip';
      c.innerHTML = `<span>${icon} <span title="${name}">${name}</span></span><span class="chip-x">×</span>`;
      c.querySelector('.chip-x').addEventListener('click', onRemove);
      return c;
    }

    // ── Textarea auto-resize ──────────────────────────────────────────────────────
    const textInput = document.getElementById('text-input');
    textInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    });

    // ── Send ──────────────────────────────────────────────────────────────────────
    document.getElementById('send-btn').addEventListener('click', send);
    textInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    async function send() {
      if (streaming) return;
      const message = textInput.value.trim();
      if (!message && !pendingImg && !pendingPdf) return;

      streaming = true;
      document.getElementById('send-btn').disabled = true;

      const imgSnap = pendingImg ? { url: pendingImg.url, name: pendingImg.name } : null;
      const pdfSnap = pendingPdf ? { name: pendingPdf.name } : null;

      const fd = new FormData();
      fd.append('thread_id', threadId);
      fd.append('message', message);
      if (pendingImg) fd.append('image', pendingImg.file);
      if (pendingPdf) fd.append('report_pdf', pendingPdf.file);

      textInput.value = '';
      textInput.style.height = 'auto';
      pendingImg = null;
      pendingPdf = null;
      renderChips();

      appendUserMsg(message, imgSnap, pdfSnap);

      // Update session title on first message
      const sess = sessions.find(s => s.threadId === threadId);
      if (sess && sess.title === 'Chat mới') {
        const raw = message || (imgSnap ? '📷 Ảnh X-quang' : '📄 Báo cáo PDF');
        sess.title = raw.length > 32 ? raw.slice(0, 30) + '…' : raw;
        renderSessionList();
      }

      let { bubble, gradcamRow } = appendAssistantMsg();
      let typingEl = document.createElement('div');
      typingEl.className = 'typing';
      typingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      bubble.appendChild(typingEl);
      scrollBottom();

      let textEl = null, currentText = '';

      function handleEvent(type, data) {
        if (type === 'text') {
          typingEl.style.display = 'none';
          if (!textEl) {
            textEl = document.createElement('div');
            bubble.insertBefore(textEl, typingEl);
          }
          currentText += data.content;
          textEl.innerHTML = mdToHtml(currentText) + '<span class="cursor">▌</span>';
          scrollBottom();

        } else if (type === 'media_done') {
          // Prediction summary complete — open second bubble immediately for RAG
          typingEl.remove();
          bubble.querySelector('.cursor')?.remove();
          ({ bubble, gradcamRow } = appendAssistantMsg());
          textEl = null;
          currentText = '';
          typingEl = document.createElement('div');
          typingEl.className = 'typing';
          typingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
          bubble.appendChild(typingEl);
          scrollBottom();

        } else if (type === 'gradcam') {
          const wrap = document.createElement('div');
          wrap.className = 'gradcam-wrap';
          const img = document.createElement('img');
          img.src = `data:image/png;base64,${data.b64}`;
          img.alt = `Grad-CAM: ${data.label}`;
          const cap = document.createElement('div');
          cap.className = 'gradcam-caption';
          cap.textContent = data.label;
          wrap.append(img, cap);
          gradcamRow.appendChild(wrap);
          scrollBottom();

        } else if (type === 'sources') {
          const bar = getOrCreateActionsBar(bubble);
          const btn = document.createElement('div');
          btn.className = 'sources-btn';
          btn.textContent = '📚 Tài liệu tham khảo ▾';
          const panel = document.createElement('div');
          panel.className = 'sources-panel';
          const seenUrls = new Set();
          for (const src of data.sources) {
            if (seenUrls.has(src.url)) continue;
            seenUrls.add(src.url);
            const item = document.createElement('div');
            item.className = 'src-item';
            item.innerHTML = `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title || src.url)}</a>` +
              (src.excerpt ? `<div class="src-excerpt">${esc(src.excerpt)}</div>` : '');
            panel.appendChild(item);
          }
          btn.addEventListener('click', () => panel.classList.toggle('open'));
          bar.appendChild(btn);
          bubble.appendChild(panel);
          scrollBottom();

        } else if (type === 'report') {
          const bar = getOrCreateActionsBar(bubble);
          const a = document.createElement('a');
          a.className = 'btn-pdf';
          a.href = `/api/report/${data.thread_id}`;
          a.download = `medmas_report_${data.thread_id.slice(0, 8)}.pdf`;
          a.innerHTML = '⬇ Tải báo cáo PDF';
          bar.appendChild(a);
          scrollBottom();

        } else if (type === 'error') {
          showToast(data.message || 'Lỗi không xác định');

        } else if (type === 'done') {
          typingEl.remove();
          bubble.querySelector('.cursor')?.remove();
        }
      }

      try {
        const resp = await fetch('/api/chat', { method: 'POST', body: fd });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const block of parts) {
            if (!block.trim()) continue;
            let eventType = 'message', dataStr = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) eventType = line.slice(7).trim();
              else if (line.startsWith('data: ')) dataStr = line.slice(6);
            }
            if (dataStr) {
              try { handleEvent(eventType, JSON.parse(dataStr)); }
              catch (err) { console.warn('SSE parse error', err); }
            }
          }
        }
      } catch (err) {
        typingEl.remove();
        bubble.innerHTML = `<span style="color:var(--red)">Lỗi kết nối: ${esc(err.message)}</span>`;
      } finally {
        streaming = false;
        document.getElementById('send-btn').disabled = false;
        scrollBottom();
      }
    }

    // ── DOM helpers ───────────────────────────────────────────────────────────────
    function appendUserMsg(text, img, pdf) {
      const m = document.createElement('div');
      m.className = 'msg user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (img) {
        const imgEl = document.createElement('img');
        imgEl.className = 'msg-img-preview';
        imgEl.src = img.url;
        imgEl.alt = img.name;
        bubble.appendChild(imgEl);
      }
      if (pdf) {
        const chip = document.createElement('div');
        chip.className = 'msg-pdf-chip';
        chip.innerHTML = `📄 <span title="${esc(pdf.name)}">${esc(pdf.name)}</span>`;
        bubble.appendChild(chip);
      }
      if (text) {
        const textEl = document.createElement('div');
        textEl.textContent = text;
        bubble.appendChild(textEl);
      }

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '👤';
      m.append(avatar, bubble);
      document.getElementById('messages').appendChild(m);
      scrollBottom();
    }

    function appendAssistantMsg() {
      const m = document.createElement('div');
      m.className = 'msg assistant';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🩻';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const gradcamRow = document.createElement('div');
      gradcamRow.className = 'gradcam-row';
      bubble.appendChild(gradcamRow);
      m.append(avatar, bubble);
      document.getElementById('messages').appendChild(m);
      scrollBottom();
      return { bubble, gradcamRow };
    }

    function getOrCreateActionsBar(bubble) {
      let bar = bubble.querySelector('.actions-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'actions-bar';
        bubble.appendChild(bar);
      }
      return bar;
    }

    function scrollBottom() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 5000);
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    marked.use({ gfm: true, breaks: true });

    function mdToHtml(text) {
      return DOMPurify.sanitize(marked.parse(text));
    }
  </script>
</body>
