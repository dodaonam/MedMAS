readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "bs4>=0.0.2",
    "fastembed>=0.3.3,<1.0.0",
    "flagembedding>=1.4.0",
    "ipykernel>=7.2.0",
    "langchain>=1.3.6",
    "langchain-core>=1.4.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.3.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.4",
    "langsmith>=0.8.11",
    "matplotlib>=3.10.9",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "tqdm>=4.67.1",
]
